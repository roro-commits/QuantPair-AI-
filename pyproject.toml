[project]
name = "quantpairs"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Rotimi",email = "olarotimi@protonmail.com"},
]
dependencies = ["yfinance>=0.2.40", "pandas>=2.0.0", "scikit-learn>=1.9", "seaborn>=0.13.2", "statsmodels>=0.14.6", "vaderSentiment>=3.3.2", "fastapi>=0.110", "uvicorn>=0.30", "lxml>=5.0"]

requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
includes = ["src/quantpairs"]
package-dir = "src"
distribution = true

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
